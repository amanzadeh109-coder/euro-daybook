<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b379f'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='20' text-anchor='middle' fill='%23ffcc00'%3E€%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Euro Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a banknote-blue till on the left prints today's receipt; the right side is the report for a day, week or month. */
:root {
  --bg: #edf0f8; --surface: #ffffff; --ink: #121a33; --ink-2: #434c6c; --muted: #5d6583;
  --line: #d6dbea; --base: #aeb6cf; --accent: #1e3fae; --bar: #2f52c7; --hl: #e0a400;
  --wash: #e3e8f6; --good: #0b7a2f; --bad: #bd322c;
  --panel: #1b379f; --panel-ink: #ffffff; --panel-2: #c9d4fb; --panel-field: #142b83; --panel-line: #5d78d6;
  --paper: #fbfcfe; --slot: #0b164a55; --btn: #ffcc00; --btn-ink: #121a33;
  --tip: #121a33; --tip-ink: #ffffff; --shadow: #121a3322;
  --display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1226; --surface: #141b35; --ink: #e8ebf6; --ink-2: #b6bdd6; --muted: #9098b5;
    --line: #2a3358; --base: #47517c; --accent: #9db1ff; --bar: #7f9bff; --hl: #ffcc00;
    --wash: #1e2748; --good: #5bd07d; --bad: #ff948a;
    --panel: #1a2c80; --panel-ink: #ffffff; --panel-2: #c2cdf7; --panel-field: #121f60; --panel-line: #4a60bd;
    --paper: #1c2546; --slot: #00000088; --btn: #ffcc00; --btn-ink: #121a33;
    --tip: #e8ebf6; --tip-ink: #0c1226; --shadow: #00000066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1226; --surface: #141b35; --ink: #e8ebf6; --ink-2: #b6bdd6; --muted: #9098b5;
  --line: #2a3358; --base: #47517c; --accent: #9db1ff; --bar: #7f9bff; --hl: #ffcc00;
  --wash: #1e2748; --good: #5bd07d; --bad: #ff948a;
  --panel: #1a2c80; --panel-ink: #ffffff; --panel-2: #c2cdf7; --panel-field: #121f60; --panel-line: #4a60bd;
  --paper: #1c2546; --slot: #00000088; --btn: #ffcc00; --btn-ink: #121a33;
  --tip: #e8ebf6; --tip-ink: #0c1226; --shadow: #00000066;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 72px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.till :focus-visible { outline-color: var(--btn); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.wrap { max-width: 1140px; margin-inline: auto; display: grid; gap: 20px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.brand { margin: 0; font: 700 1.5rem/1.1 var(--display); letter-spacing: -.01em; }
.top-side { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.top-date { color: var(--muted); }
.theme-btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--base); border-radius: 999px; background: var(--surface); color: var(--ink); padding: 6px 12px; font-size: .86rem; font-weight: 500; }
.theme-btn:hover { background: var(--wash); }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.notice { padding: 10px 14px; border-radius: 8px; background: var(--wash); color: var(--ink); }
.notice strong { font-weight: 600; }

.layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .layout { grid-template-columns: 360px minmax(0, 1fr); gap: 36px; } }

/* The till */
.till-col { min-width: 0; }
.till { position: relative; z-index: 1; background: var(--panel); color: var(--panel-ink); border-radius: 14px; padding: 18px; display: grid; gap: 14px; color-scheme: dark; }
.till-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.till h2 { margin: 0; font: 700 1.1rem/1.2 var(--display); }
.linkish { background: none; border: 0; padding: 2px 0; color: var(--panel-2); text-decoration: underline; text-underline-offset: 3px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .legend { font-size: .82rem; font-weight: 500; color: var(--panel-2); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 7px; }
legend { padding: 0; margin-bottom: 7px; }
.amount-box { display: flex; align-items: center; gap: 8px; background: var(--panel-field); border: 1px solid var(--panel-line); border-radius: 10px; padding: 6px 12px; }
.amount-box:focus-within { border-color: var(--btn); }
.amount-box span { font: 500 2rem/1 var(--mono); color: var(--panel-2); }
#amount { width: 100%; min-width: 0; background: none; border: 0; outline: 0; font: 500 2.2rem/1.2 var(--mono); color: var(--panel-ink); }
#amount::placeholder { color: var(--panel-line); }
.text-input { width: 100%; min-width: 0; background: var(--panel-field); border: 1px solid var(--panel-line); border-radius: 8px; padding: 9px 11px; color: var(--panel-ink); }
.text-input::placeholder { color: var(--panel-2); opacity: .75; }
.text-input:focus { border-color: var(--btn); outline: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip span { display: block; padding: 5px 10px; border: 1px solid var(--panel-line); border-radius: 999px; font-size: .84rem; }
.chip input:checked + span { background: var(--panel-ink); border-color: var(--panel-ink); color: var(--panel); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--btn); outline-offset: 2px; }
.form-error { margin: 0; padding: 7px 10px; border-radius: 6px; background: var(--panel-field); color: var(--btn); font-size: .88rem; }
.form-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-main { flex: 1 1 150px; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--btn); color: var(--btn-ink); font-weight: 600; }
.btn-main:disabled { opacity: .55; }
.btn-side { border: 1px solid var(--panel-line); background: none; border-radius: 10px; padding: 11px 13px; color: var(--panel-ink); }

/* The receipt it prints */
.receipt {
  margin-inline: 14px; background: var(--paper); color: var(--ink); padding: 22px 16px 28px;
  font: 400 .86rem/1.4 var(--mono); position: relative;
  box-shadow: inset 0 10px 8px -8px var(--slot);
  --tooth: 7px;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% 100% / calc(2 * var(--tooth)) 51% repeat-x, linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% 100% / calc(2 * var(--tooth)) 51% repeat-x, linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat;
}
.r-head { display: flex; justify-content: space-between; gap: 10px; text-transform: uppercase; letter-spacing: .06em; font-size: .76rem; color: var(--muted); }
.r-rule { border: 0; border-top: 1px dashed var(--base); margin: 10px 0; }
.r-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.r-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; width: calc(100% + 8px); text-align: left; background: none; border: 0; padding: 3px 4px; margin-inline: -4px; border-radius: 4px; font: inherit; }
.r-line:hover { background: var(--wash); }
.r-line span:first-child { overflow-wrap: anywhere; }
.r-line span:last-child { font-variant-numeric: tabular-nums; }
.r-empty { margin: 0; color: var(--muted); }
.r-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.r-count { margin: 4px 0 0; color: var(--muted); font-size: .76rem; }

/* The report */
.report-col { min-width: 0; display: grid; gap: 22px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--wash); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 6px 14px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px var(--shadow); }
.pager { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pager-label { font-weight: 500; text-align: center; min-width: 0; padding-inline: 4px; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; border: 0; border-radius: 8px; background: none; color: var(--ink-2); }
.icon-btn:hover:not(:disabled) { background: var(--wash); color: var(--ink); }
.icon-btn:disabled { opacity: .3; }
.icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ghost { border: 0; background: none; color: var(--accent); font-weight: 500; padding: 4px 6px; border-radius: 6px; }
.ghost:hover { background: var(--wash); }

#report { display: grid; gap: 26px; min-width: 0; transition: opacity .15s; }
#report.stale { opacity: .55; }
.hero { display: grid; gap: 2px; }
.hero-label { margin: 0; color: var(--muted); font-size: .88rem; }
.hero-num { margin: 0; font: 700 clamp(2.6rem, 8vw, 3.8rem)/1.05 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.delta { margin: 4px 0 0; display: flex; gap: 6px; align-items: baseline; color: var(--ink-2); }
.delta b { font-weight: 600; }
.delta.up b { color: var(--bad); }
.delta.down b { color: var(--good); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; margin: 0; padding-block: 14px; border-block: 1px solid var(--line); }
@media (min-width: 620px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { min-width: 0; }
.stat dt { font-size: .8rem; color: var(--muted); }
.stat dd { margin: 2px 0 0; font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.stat small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }

.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.sec-head h3 { margin: 0; font: 700 1.05rem/1.25 var(--display); }
.sec-note { color: var(--muted); font-size: .84rem; }

/* Daily columns: one scale for bars, ticks and labels */
.chart { display: grid; grid-template-columns: 42px minmax(0, 1fr); position: relative; }
.y { position: relative; height: 180px; font: 400 .72rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.y span { position: absolute; right: 7px; transform: translateY(50%); }
.plot { position: relative; min-width: 0; }
.grid-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.grid-line.zero { background: var(--base); }
.cols { position: relative; display: grid; }
.col { display: block; border: 0; background: none; padding: 0; min-width: 0; border-radius: 4px; }
.barzone { display: block; position: relative; height: 180px; }
.col:hover .barzone { background: var(--wash); }
.bar { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 30px); background: var(--bar); border-radius: 4px 4px 0 0; }
.col.is-hl .bar { background: var(--hl); }
.cap { position: absolute; left: 50%; transform: translateX(-50%); font: 500 .74rem/1 var(--mono); white-space: nowrap; padding-bottom: 3px; font-variant-numeric: tabular-nums; }
.cap.start { left: 0; transform: none; }
.cap.end { left: auto; right: 0; transform: none; }
.xlab { display: block; height: 24px; padding-top: 7px; text-align: center; font-size: .74rem; line-height: 1; color: var(--muted); white-space: nowrap; }
.col.is-hl .xlab { color: var(--ink); font-weight: 600; }
.tip { position: absolute; top: 0; z-index: 3; background: var(--tip); color: var(--tip-ink); border-radius: 6px; padding: 5px 8px; font-size: .78rem; line-height: 1.3; white-space: nowrap; pointer-events: none; }
.tip b { font: 600 .84rem var(--mono); display: block; }

/* Categories */
.cats { display: grid; gap: 2px; }
.cat { display: grid; grid-template-columns: minmax(84px, 130px) minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 6px 6px; }
.cat:hover { background: var(--wash); }
.cat[aria-pressed="true"] { background: var(--wash); font-weight: 600; }
.cat-track { display: block; height: 8px; min-width: 0; }
.cat-fill { display: block; height: 100%; min-width: 3px; background: var(--bar); border-radius: 0 4px 4px 0; }
.cat-amt { font: 500 .88rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.cat-amt small { color: var(--muted); font-weight: 400; display: inline-block; min-width: 3.4em; }

/* Entries */
.day-group { display: grid; }
.day-head { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0 5px; border-bottom: 1px solid var(--base); font-size: .84rem; font-weight: 600; }
.day-head span:last-child { font: 500 .84rem var(--mono); font-variant-numeric: tabular-nums; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.entry-name { min-width: 0; overflow-wrap: anywhere; }
.entry-name small { display: block; color: var(--muted); font-size: .8rem; }
.entry-amt { font: 500 .95rem var(--mono); font-variant-numeric: tabular-nums; }
.entry-acts { display: flex; }
.empty { padding: 18px; border: 1px dashed var(--base); border-radius: 10px; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); font-weight: 600; }

.toast { position: fixed; z-index: 20; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); background: var(--tip); color: var(--tip-ink); border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 18px var(--shadow); }
.toast button { border: 0; background: none; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.login { min-height: 80vh; display: grid; place-items: center; }
.login .till { width: min(100%, 380px); }
.login p { margin: 0; color: var(--panel-2); }
.top-side .ghost { padding: 6px 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="till" id="login-form" novalidate>
    <h1 class="brand">Euro Daybook</h1>
    <p>Enter your password to open your ledger.</p>
    <div class="field">
      <label for="password">Password</label>
      <input class="text-input" id="password" type="password" autocomplete="current-password">
    </div>
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <div class="form-actions"><button class="btn-main" id="login-submit" type="submit">Open ledger</button></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <h1 class="brand">Euro Daybook</h1>
    <div class="top-side"><span class="top-date" id="top-date"></span><button class="theme-btn" id="theme-btn" type="button"></button><button class="ghost" id="logout" type="button">Log out</button></div>
  </header>
  <p class="notice" id="notice" hidden></p>

  <div class="layout">
    <div class="till-col">
      <form class="till" id="form" novalidate>
        <div class="till-head">
          <h2 id="form-title">Log a purchase</h2>
          <button type="button" class="linkish" id="use-today" hidden>Back to today</button>
        </div>
        <div class="field">
          <label for="amount">Amount in euro</label>
          <div class="amount-box"><span aria-hidden="true">€</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00"></div>
        </div>
        <div class="field">
          <label for="note">What for</label>
          <input class="text-input" id="note" list="recent-notes" autocomplete="off" maxlength="80" placeholder="Bus ticket, lunch, phone top-up">
          <datalist id="recent-notes"></datalist>
        </div>
        <fieldset>
          <legend class="legend">Category</legend>
          <div class="chips" id="chips"></div>
        </fieldset>
        <div class="field">
          <label for="date">Date</label>
          <input class="text-input" id="date" type="date">
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button class="btn-main" id="submit" type="submit">Add expense</button>
          <button class="btn-side" id="cancel" type="button" hidden>Cancel</button>
          <button class="btn-side" id="remove" type="button" hidden>Delete</button>
        </div>
      </form>
      <section class="receipt" aria-label="Today's purchases" id="receipt"></section>
    </div>

    <main class="report-col">
      <div class="controls">
        <div class="seg" role="group" aria-label="Report period">
          <button type="button" data-view="day" aria-pressed="false">Day</button>
          <button type="button" data-view="week" aria-pressed="false">Week</button>
          <button type="button" data-view="month" aria-pressed="false">Month</button>
        </div>
        <div class="pager">
          <button class="icon-btn" id="prev" type="button" aria-label="Previous period"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span class="pager-label" id="period-label" aria-live="polite"></span>
          <button class="icon-btn" id="next" type="button" aria-label="Next period"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          <button class="ghost" id="jump" type="button" hidden>Today</button>
        </div>
      </div>
      <div id="report"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- categories ---------- */
  var CATS = [
    ["food", "Food & drink"], ["groceries", "Groceries"], ["transport", "Transport"],
    ["home", "Home & bills"], ["education", "Education"], ["health", "Health"],
    ["shopping", "Shopping"], ["fun", "Fun"], ["other", "Other"]
  ];
  var CAT_NAME = {};
  CATS.forEach(function (c) { CAT_NAME[c[0]] = c[1]; });
  function catName(id) { return CAT_NAME[id] || "Other"; }

  /* ---------- money: stored as whole cents ---------- */
  var EUR = new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR" });
  function money(cents) { return EUR.format(cents / 100); }
  function parseAmount(raw) {
    var s = String(raw).replace(/[€\s]/g, "");
    if (!s) return null;
    var lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
    if (lastComma > -1 && lastDot > -1) {
      if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (lastComma > -1) {
      s = s.replace(",", ".");
    }
    if (!/^\d+(\.\d{1,2})?$|^\.\d{1,2}$/.test(s)) return null;
    var cents = Math.round(parseFloat(s) * 100);
    return cents > 0 && cents <= 100000000 ? cents : null;
  }

  /* ---------- dates: local calendar days as YYYY-MM-DD ---------- */
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
  function parseDay(s) { var a = s.split("-"); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function addDays(s, n) { var d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diffDays(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
  function weekStart(s) { var d = parseDay(s); return addDays(s, -((d.getDay() + 6) % 7)); }
  function monthStart(s) { return s.slice(0, 8) + "01"; }
  function monthEnd(s) { var d = parseDay(s); return ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  function shiftMonth(s, n) { var d = parseDay(s); return ymd(new Date(d.getFullYear(), d.getMonth() + n, 1)); }
  function fmt(s, opts) { return parseDay(s).toLocaleDateString("en-GB", opts); }
  function longDay(s) { return fmt(s, { weekday: "short", day: "numeric", month: "short" }); }

      }
    }
    var heroLabel = view === "day" ? (current ? "Spent today" : "Spent this day") : view === "week" ? (current ? "Spent this week" : "Spent that week") : (current ? "Spent this month" : "Spent that month");

    /* stats */
    var cats = byCat(all), topCat = cats[0];
    var topCatStat = statEl("Top category", topCat ? catName(topCat.id) : "None yet", topCat ? money(topCat.cents) + " · " + Math.round(topCat.cents / total * 100) + "%" : null);
    var busiestKey = null, busiest = 0;
    Object.keys(map).forEach(function (d) { if (map[d] > busiest) { busiest = map[d]; busiestKey = d; } });
    var busyStat = statEl("Busiest day", busiestKey ? money(busiest) : "None yet", busiestKey ? longDay(busiestKey) : null);
    var countStat = statEl("Purchases", String(all.length));
    var stats;
    if (view === "day") {
      var last7 = sum(inRange(state.window, addDays(r.start, -6), r.start));
      var biggest = all.reduce(function (a, e) { return !a || e.amountCents > a.amountCents ? e : a; }, null);
      stats = [countStat,
        statEl("Biggest purchase", biggest ? money(biggest.amountCents) : "None yet", biggest ? biggest.note || catName(biggest.category) : null),
        topCatStat, statEl("7-day average", money(Math.round(last7 / 7)), "per day")];
    } else {
      var elapsed = current ? diffDays(r.start, today) + 1 : diffDays(r.start, r.end) + 1;
      var avg = Math.round(total / elapsed);
      var avgStat = statEl("Daily average", money(avg), current ? "over " + elapsed + (elapsed === 1 ? " day so far" : " days so far") : "over " + elapsed + " days");
      if (view === "month" && current) {
        var dim = diffDays(r.start, r.end) + 1;
        stats = [avgStat, statEl("On pace for", money(Math.round(total / elapsed * dim)), "by " + fmt(r.end, { day: "numeric", month: "short" })), busyStat, topCatStat];
      } else {
        stats = [avgStat, countStat, busyStat, topCatStat];
      }
    }

    /* the chart needs the wider window in day view */
    var chartList = view === "day" ? inRange(state.window, addDays(r.start, -6), r.start) : all;

    var report = $("report");
    if (state.filter && !cats.some(function (c) { return c.id === state.filter; })) state.filter = null;
    report.classList.toggle("stale", state.stale && state.loaded);
    report.replaceChildren(
      h("div", { class: "hero" }, [h("p", { class: "hero-label", text: heroLabel }), h("p", { class: "hero-num", text: money(total) }), deltaEl]),
      h("dl", { class: "stats" }, stats),
      renderChart(view, r, chartList)
    );
    var catsEl = renderCats(all, total);
    if (catsEl) report.appendChild(catsEl);
    report.appendChild(renderEntries(view, r, all));
    if (fk) { var again = report.querySelector('[data-fk="' + fk + '"]'); if (again) again.focus(); }
  }

  function exportCsv(r, all) {
    function cell(v) {
      var s = String(v);
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    var lines = ["date,category,what_for,amount_eur"];
    all.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function (e) {
      lines.push([e.date, cell(catName(e.category)), cell(e.note), (e.amountCents / 100).toFixed(2)].join(","));
    });
    var url = URL.createObjectURL(new Blob([lines.join("\n") + "\n"], { type: "text/csv;charset=utf-8" }));
    var link = h("a", { href: url, download: "euro-daybook-" + r.start + "-to-" + r.end + ".csv" });
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("CSV saved");
  }

  /* ---------- navigation ---------- */
  function afterNav() { state.filter = null; loadWindow(); renderReport(); }
  function step(dir) {
    var r = rangeFor(state.view, state.anchor);
    if (state.view === "day") state.anchor = addDays(state.anchor, dir);
    else if (state.view === "week") state.anchor = addDays(r.start, 7 * dir);
    else state.anchor = shiftMonth(r.start, dir);
    afterNav();
  }
  function rollDay() {
    var now = ymd(new Date());
    if (now === today) return;
    var wasToday = state.anchor === today;
    today = now;
    if (wasToday) state.anchor = now;
    if (!state.editing) { $("date").value = now; syncDateHint(); }
    $("top-date").textContent = fullDay(today);
    loadToday(); loadWindow(true); renderReceipt(); renderReport();
  }

  /* ---------- start ---------- */
  var ICON_SUN = "M12 4V2M12 22v-2M4 12H2M22 12h-2M6.3 6.3L4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z";
  var ICON_MOON = "M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z";
  function currentTheme() {
    var set = document.documentElement.getAttribute("data-theme");
    if (set === "dark" || set === "light") return set;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function syncThemeButton() {
    var toLight = currentTheme() === "dark";
    $("theme-btn").replaceChildren(icon(toLight ? ICON_SUN : ICON_MOON), document.createTextNode(toLight ? "Light mode" : "Dark mode"));
  }
  function wireTheme() {
    var saved = store("daybook-theme");
    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    $("theme-btn").addEventListener("click", function () {
      var next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      store("daybook-theme", next);
    });
    new MutationObserver(syncThemeButton).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeButton);
    syncThemeButton();
  }

  function wire() {
    wireTheme();
    buildChips();
    $("date").value = today;
    $("top-date").textContent = fullDay(today);
    $("form").addEventListener("submit", onSubmit);
    $("date").addEventListener("input", syncDateHint);
    $("use-today").addEventListener("click", function () { $("date").value = today; syncDateHint(); });
    $("cancel").addEventListener("click", function () { resetForm(false); });
    $("remove").addEventListener("click", function () { if (state.editing) removeEntry(state.editing); });
    $("prev").addEventListener("click", function () { step(-1); });
    $("next").addEventListener("click", function () { step(1); });
    $("jump").addEventListener("click", function () { state.anchor = today; afterNav(); });
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.addEventListener("click", function () { state.view = b.dataset.view; store("daybook-view", state.view); afterNav(); });
    });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) { rollDay(); refreshAll(); } });
    $("login-form").addEventListener("submit", onLogin);
    $("logout").addEventListener("click", function () { api("/api/logout", { method: "POST" }).catch(function () {}).then(showLogin); });
    setInterval(rollDay, 60000);
    syncSubmit();
    renderReceipt();
    renderReport();
  }

  function showLogin() {
    signedIn = false;
    state.canSave = false;
    state.window = []; state.todayRows = []; state.loaded = false; windowKey = null;
    syncSubmit();
    $("app").hidden = true;
    $("login").hidden = false;
    $("password").value = "";
    $("password").focus();
  }
  function showApp() {
    signedIn = true;
    state.canSave = true;
    syncSubmit();
    $("login").hidden = true;
    $("app").hidden = false;
    renderReceipt();
    renderReport();
  }
  function onLogin(ev) {
    ev.preventDefault();
    var err = $("login-error"), btn = $("login-submit");
    err.hidden = true;
    btn.disabled = true;
    fetch("/api/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("password").value }) })
      .then(function (res) {
        if (res.ok) { showApp(); refreshAll(); $("amount").focus(); return; }
        return res.json().catch(function () { return {}; }).then(function (body) {
          err.textContent = (body.error && body.error.message) || "Sign-in failed. Try again in a moment.";
          err.hidden = false;
          $("password").select();
        });
      }, function () {
        err.textContent = "The connection dropped. Check it and try again.";
        err.hidden = false;
      }).then(function () { btn.disabled = false; });
  }
  function boot() {
    wire();
    var from = shiftMonth(state.anchor, -1), to = monthEnd(shiftMonth(state.anchor, 1));
    fetch("/api/expenses?from=" + from + "&to=" + to, { credentials: "same-origin" }).then(function (res) {
      if (res.status === 401) { showLogin(); return; }
      showApp();
      refreshAll();
    }, function () {
      showApp();
      showNotice("Your ledger can't be reached right now. Check your connection and reload.");
    });
  }
  boot();
})();
</script>
